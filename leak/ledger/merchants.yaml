# Merchant catalog. Add entries freely -- PRs welcome.
#
# id:        stable slug used everywhere (findings, evals)
# aliases:   lowercase phrases matched on word boundaries against statement
#            narrations, SMS, email subjects/senders, UPI handles. Longest match wins.
# domains:   sender email domains that identify the merchant on their own
# typical:   typical INR price per cadence (sanity checks, savings estimates)
# cancel:    where to cancel; `email` enables cancellation drafts (Phase 5)
# includes:  for bundles (telecom/credit-card plans): merchant ids included
#
# Prices and cancel links drift; treat them as hints and verify before acting.

